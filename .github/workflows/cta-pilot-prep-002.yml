name: CTA-PILOT-PREP-002

on:
  pull_request:
    paths:
      - "src/modules/blind_runs/**"
      - "src/modules/pilot_intake/**"
      - "src/modules/model_profiles/**"
      - "src/modules/prompt_registry/**"
      - "src/app/routers.py"
      - "src/shared/db/session.py"
      - "migrations/**"
      - "tests/test_blind_runs.py"
      - "tests/fixtures/blind_runs/**"
      - ".github/workflows/cta-pilot-prep-002.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cta-pilot-prep-002-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-acceptance:
    name: Synthetic blind-run acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CTA_DATABASE_URL: sqlite:///./.ci/cta-pilot-prep-002.db
      CTA_LOCAL_ONLY_MODE: "true"
      CTA_HOST: 127.0.0.1
      CTA_PUBLIC_BASE_URL: http://localhost:8000
      CTA_TRUSTED_HOSTS: localhost,127.0.0.1,test,testserver
      CTA_CORS_ALLOWED_ORIGINS: ""
      CTA_ALLOW_CLOUD_LLM: "false"
      CTA_LLM_PROVIDER: stub
      CTA_VISION_PROVIDER: stub
      CTA_ENABLE_AUTH: "false"
      CTA_SECURITY_FAIL_CLOSED: "true"
      CTA_SECURITY_HEADERS_ENABLED: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -e ".[dev]" --quiet
      - name: Prepare isolated state
        run: |
          rm -rf .ci
          mkdir -p .ci data/storage data/exports data/backups
      - name: Compile implementation
        run: python -m compileall -q src/modules/blind_runs tests/test_blind_runs.py
      - name: Verify model registry and migrations
        run: |
          python scripts/check_model_registry.py
          python scripts/run_migrations.py
          python scripts/check_migrations.py
      - name: Run targeted synthetic acceptance
        run: python -m pytest tests/test_blind_runs.py -q -s
