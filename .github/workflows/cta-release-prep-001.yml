name: CTA-RELEASE-PREP-001

on:
  pull_request:
    paths:
      - ".env.onprem.example"
      - "config/release/cta_release_prep_001.json"
      - "config/model_profiles/production/cta_model_001.mac_mini_m4pro_24gb.frozen.json"
      - "config/model_profiles/runtime/**"
      - "scripts/cta_release_prep_001.py"
      - "scripts/cta_release_prep_001_clean_install.py"
      - "tests/test_cta_release_prep_001.py"
      - "docs/releases/CTA-RELEASE-PREP-001_ONPREM_RUNBOOK_RU.md"
      - "docs/local/CTA-RELEASE-PREP-001_MAC_MINI_OPENCODE.md"
      - "docs/acceptance/CTA-RELEASE-PREP-001.md"
      - "docs/releases/0.1.0-rc1.md"
      - "Makefile"
      - ".gitignore"
      - ".github/workflows/cta-release-prep-001.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cta-release-prep-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-skeleton:
    name: Deterministic bundle and clean install
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CTA_LOCAL_ONLY_MODE: "true"
      CTA_ALLOW_CLOUD_LLM: "false"
      CTA_LLM_PROVIDER: stub
      CTA_VISION_PROVIDER: stub
      CTA_ENABLE_AUTH: "true"
      CTA_SECURITY_FAIL_CLOSED: "true"
      CTA_SECURITY_HEADERS_ENABLED: "true"
      CTA_HOST: 127.0.0.1
      CTA_TRUSTED_HOSTS: localhost,127.0.0.1,testserver
      CTA_CORS_ALLOWED_ORIGINS: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -e ".[dev]" --quiet

      - name: Prepare isolated output
        run: |
          rm -rf .ci/cta-release-prep-001
          mkdir -p .ci/cta-release-prep-001/build-a
          mkdir -p .ci/cta-release-prep-001/build-b
          mkdir -p .ci/cta-release-prep-001/evidence

      - name: Compile and structural gate
        run: |
          python -m compileall -q \
            scripts/cta_release_prep_001.py \
            scripts/cta_release_prep_001_clean_install.py \
            tests/test_cta_release_prep_001.py
          python scripts/check_code_health.py

      - name: Run targeted acceptance tests
        run: python -m pytest tests/test_cta_release_prep_001.py -q -s

      - name: Build release twice
        run: |
          python scripts/cta_release_prep_001.py --project-root . build \
            --output-dir .ci/cta-release-prep-001/build-a \
            --source-revision "$GITHUB_SHA"
          python scripts/cta_release_prep_001.py --project-root . build \
            --output-dir .ci/cta-release-prep-001/build-b \
            --source-revision "$GITHUB_SHA"

      - name: Verify byte determinism
        run: |
          cmp \
            .ci/cta-release-prep-001/build-a/creative-test-agent-onprem-0.1.0-rc1.zip \
            .ci/cta-release-prep-001/build-b/creative-test-agent-onprem-0.1.0-rc1.zip
          sha256sum .ci/cta-release-prep-001/build-a/creative-test-agent-onprem-0.1.0-rc1.zip

      - name: Validate release ZIP
        run: |
          python scripts/cta_release_prep_001.py --project-root . validate \
            --bundle .ci/cta-release-prep-001/build-a/creative-test-agent-onprem-0.1.0-rc1.zip

      - name: Clean-machine synthetic install and rollback
        run: |
          python scripts/cta_release_prep_001_clean_install.py \
            --bundle .ci/cta-release-prep-001/build-a/creative-test-agent-onprem-0.1.0-rc1.zip \
            --evidence .ci/cta-release-prep-001/evidence/clean-install.json

      - name: Upload validated release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cta-release-prep-001-evidence
          path: |
            .ci/cta-release-prep-001/build-a/creative-test-agent-onprem-0.1.0-rc1.zip
            .ci/cta-release-prep-001/build-a/creative-test-agent-onprem-0.1.0-rc1.zip.sha256
            .ci/cta-release-prep-001/evidence/clean-install.json
          if-no-files-found: warn
          retention-days: 7
