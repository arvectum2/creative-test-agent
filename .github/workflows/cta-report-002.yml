name: CTA-REPORT-002

on:
  pull_request:
    paths:
      - "src/modules/client_report_v2/**"
      - "src/modules/campaign_evidence/router.py"
      - "scripts/client_report_v2.py"
      - "tests/test_client_report_v2.py"
      - "docs/**CTA-REPORT-002**"
      - "docs/client_report_v2.md"
      - ".github/workflows/cta-report-002.yml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CTA_DATABASE_URL: sqlite:///./.ci/creative_test_agent.db
      CTA_LOCAL_ONLY_MODE: "true"
      CTA_HOST: 127.0.0.1
      CTA_PUBLIC_BASE_URL: http://localhost:8000
      CTA_TRUSTED_HOSTS: localhost,127.0.0.1,test,testserver
      CTA_ALLOW_CLOUD_LLM: "false"
      CTA_LLM_PROVIDER: stub
      CTA_VISION_PROVIDER: stub
      CTA_ENABLE_AUTH: "false"
      CTA_SECURITY_FAIL_CLOSED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -e ".[dev]" --quiet
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Run report v2 tests
        run: python -m pytest tests/test_client_report_v2.py -q
      - name: Build acceptance bundle
        run: |
          rm -rf .ci/cta-report-002
          python scripts/client_report_v2.py self-test --output .ci/cta-report-002
          python scripts/client_report_v2.py validate --input .ci/cta-report-002
          python scripts/client_report_v2.py check-determinism
          test -f .ci/cta-report-002/client_report_v2.html
          test -f .ci/cta-report-002/client_report_v2_one_page.pptx
          test -f .ci/cta-report-002/client_report_v2_full.pptx
          test -f .ci/cta-report-002/client_report_v2.docx
          test -f .ci/cta-report-002/client_report_v2_evidence.json
          test -f .ci/cta-report-002/client_report_v2_appendix.xlsx
          test -f .ci/cta-report-002/report_manifest.json
      - name: Upload acceptance bundle
        uses: actions/upload-artifact@v4
        with:
          name: cta-report-002-acceptance
          path: .ci/cta-report-002
          retention-days: 14
