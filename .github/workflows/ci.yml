name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CTA_DATABASE_URL: sqlite:///./.ci/creative_test_agent.db
      CTA_LOCAL_ONLY_MODE: "true"
      CTA_HOST: 127.0.0.1
      CTA_PUBLIC_BASE_URL: http://localhost:8000
      CTA_TRUSTED_HOSTS: localhost,127.0.0.1,test,testserver
      CTA_CORS_ALLOWED_ORIGINS: ""
      CTA_ALLOW_CLOUD_LLM: "false"
      CTA_LLM_PROVIDER: stub
      CTA_VISION_PROVIDER: stub
      CTA_ENABLE_AUTH: "false"
      CTA_SECURITY_FAIL_CLOSED: "true"
      CTA_SECURITY_HEADERS_ENABLED: "true"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -e ".[dev]" --quiet

      - name: Prepare isolated CI state
        run: |
          rm -rf .ci
          mkdir -p .ci data/storage data/exports data/backups

      - name: Compile Python sources
        run: python -m compileall -q src scripts

      - name: Verify SQLAlchemy model registry
        run: python scripts/check_model_registry.py

      - name: Apply and verify Alembic migrations
        run: |
          python scripts/run_migrations.py
          python scripts/check_migrations.py

      - name: Verify blocking security inputs
        run: |
          python - <<'PY'
          from src.shared.config.settings import get_settings
          from src.shared.security.hardening import (
              is_loopback_host,
              is_loopback_url,
              validate_security_posture,
          )

          settings = get_settings()
          assert settings.local_only_mode is True
          assert is_loopback_host(settings.host), settings.host
          assert is_loopback_url(settings.public_base_url), settings.public_base_url
          assert all(is_loopback_host(host) for host in settings.trusted_hosts_list), settings.trusted_hosts_list
          assert not settings.allow_cloud_llm
          assert not settings.cors_origins_list or all(
              is_loopback_url(origin) for origin in settings.cors_origins_list
          )
          posture = validate_security_posture(settings)
          assert not posture.blocking_errors, [
              (item.key, item.message) for item in posture.blocking_errors
          ]
          print("BLOCKING_SECURITY_INPUTS_VERIFIED")
          PY

      - name: Verify local security posture
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.check_security_posture 2>&1 | tee .ci/security-posture.log

      - name: Verify PRE-PILOT-006 backup recovery unit tests
        run: python -m pytest tests/test_backup_recovery_integrity.py -q -s

      - name: Run regression test suite
        shell: bash
        run: |
          if ! python -m pytest tests/ -q \
            --ignore=tests/test_pre_tz_messy_demo.py \
            >.ci/pytest.log 2>&1; then
            echo "pytest failed. Last 250 log lines:"
            tail -n 250 .ci/pytest.log
            exit 1
          fi
          cat .ci/pytest.log

      - name: Verify PRE-PILOT-002 synthetic creative golden pack
        shell: bash
        run: |
          python scripts/synthetic_creative_golden_pack.py validate
          python scripts/synthetic_creative_golden_pack.py generate \
            --output .ci/synthetic-creative-golden-pack
          python scripts/synthetic_creative_golden_pack.py validate \
            --output .ci/synthetic-creative-golden-pack
          python scripts/synthetic_creative_golden_pack.py check-determinism
          test -f .ci/synthetic-creative-golden-pack/contact_sheet.png
          test -f .ci/synthetic-creative-golden-pack/generated_manifest.json

      - name: Verify PRE-PILOT-003 local vision benchmark harness
        shell: bash
        run: |
          python scripts/benchmark_local_vision.py self-test \
            --output .ci/pre-pilot-003-self-test
          python scripts/benchmark_local_vision.py validate \
            --input .ci/pre-pilot-003-self-test
          test -f .ci/pre-pilot-003-self-test/benchmark_results.json
          test -f .ci/pre-pilot-003-self-test/benchmark_summary.csv
          test -f .ci/pre-pilot-003-self-test/benchmark_report.md
          test -f .ci/pre-pilot-003-self-test/benchmark_manifest.json

      - name: Verify PRE-PILOT-004 pilot intake package
        shell: bash
        run: |
          python scripts/pilot_intake_package.py generate \
            --output .ci/pre-pilot-004-intake
          python scripts/pilot_intake_package.py validate \
            --input .ci/pre-pilot-004-intake
          python scripts/pilot_intake_package.py check-determinism
          test -f .ci/pre-pilot-004-intake/client_intake_manifest.json
          test -f .ci/pre-pilot-004-intake/pilot_acceptance_plan.json
          test -f .ci/pre-pilot-004-intake/file_register.csv
          test -f .ci/pre-pilot-004-intake/relationship_hints.csv
          test -f .ci/pre-pilot-004-intake/package_manifest.json

      - name: Verify PRE-PILOT-005 provisional one-page client report
        shell: bash
        run: |
          python scripts/client_one_page_report.py self-test \
            --output .ci/pre-pilot-005-one-page
          python scripts/client_one_page_report.py validate \
            --input .ci/pre-pilot-005-one-page
          python scripts/client_one_page_report.py check-determinism
          test -f .ci/pre-pilot-005-one-page/client_one_page_report.pptx
          test -f .ci/pre-pilot-005-one-page/client_one_page_report.html
          test -f .ci/pre-pilot-005-one-page/client_one_page_report_evidence.json
          test -f .ci/pre-pilot-005-one-page/report_manifest.json

      - name: Verify PRE-PILOT-006 operator and recovery rehearsal
        shell: bash
        run: |
          set -o pipefail
          timeout 240s python scripts/operator_recovery_rehearsal.py run \
            --workspace .ci/pre-pilot-006-rehearsal \
            --respondent-count 12 \
            2>&1 | tee .ci/pre-pilot-006-rehearsal.log
          python scripts/operator_recovery_rehearsal.py validate \
            --input .ci/pre-pilot-006-rehearsal
          python scripts/check_backup.py \
            .ci/pre-pilot-006-rehearsal/backups/pre_pilot_006_primary.zip
          test -f .ci/pre-pilot-006-rehearsal/rehearsal_manifest.json
          test -f .ci/pre-pilot-006-rehearsal/evidence_manifest.json
          test -f .ci/pre-pilot-006-rehearsal/evidence/operator_checklist.json
          test -f .ci/pre-pilot-006-rehearsal/evidence/automated_rehearsal_report.md
          test "$(find .ci/pre-pilot-006-rehearsal/backups -name 'pre_restore_*.zip' | wc -l)" -eq 1

      - name: Run CTA-PRE-012 executable test
        shell: bash
        run: |
          timeout 120s python -m pytest tests/test_pre_tz_messy_demo.py -q -s \
            2>&1 | tee .ci/cta-pre-012-test.log

      - name: Verify CTA-PRE-012 CLI
        shell: bash
        run: |
          timeout 120s python scripts/run_pre_tz_messy_demo.py \
            --workspace .ci/cta-pre-012-demo \
            --respondent-count 12 \
            2>&1 | tee .ci/cta-pre-012-demo.log
          test -f .ci/cta-pre-012-demo/demo_manifest.json

      - name: Upload CI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: .ci/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify closed-loop defaults
        run: python scripts/check_closed_loop.py

      - name: Verify demo readiness
        run: python scripts/check_demo_readiness.py
